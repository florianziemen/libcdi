check-develop-release:
  before_script:
    - . /sw/etc/profile.levante && module use /sw/spack-levante/spack/modules && module list
    - module load texlive/live2021-gcc-11.2.0 ruby python3
  script:
    - git checkout -B develop-release
    - ./scripts/git_add_dist
    - git commit -m 'Add automatically generated files.'
    - git push -f
  tags:
    - latex
  only:
    - develop
    - k202125/add-gitlab-ci
